name: MyFinc Push Notifications

on:
  push:
    branches:
      - main
    paths:
      - "docs/updates/manifest.json"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Enviar una notificación de prueba al tema myfinc_announcements"
        required: true
        default: false
        type: boolean
      send_update:
        description: "Enviar manualmente un aviso de nueva versión"
        required: true
        default: false
        type: boolean
      release_version:
        description: "Versión publicada, por ejemplo 0.1.5"
        required: false
        type: string
      notification_title:
        description: "Título personalizado (opcional)"
        required: false
        type: string
      notification_body:
        description: "Mensaje personalizado (opcional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: myfinc-push-notifications
  cancel-in-progress: false

jobs:
  send-new-notices:
    name: Send newly published notices through FCM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin

      - name: Send new notices
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          SEND_TEST: ${{ inputs.send_test || false }}
          SEND_UPDATE: ${{ inputs.send_update || false }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NOTIFICATION_TITLE: ${{ inputs.notification_title }}
          NOTIFICATION_BODY: ${{ inputs.notification_body }}
          FIREBASE_PROJECT_ID: myfinc-4b36e
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getMessaging } = require('firebase-admin/messaging');

          async function main() {
            const isManual = process.env.EVENT_NAME === 'workflow_dispatch';
            const rawCredentials = process.env.FIREBASE_SERVICE_ACCOUNT;
            if (!rawCredentials) {
              throw new Error(
                'Missing FIREBASE_SERVICE_ACCOUNT repository secret. Add the Firebase service-account JSON as a GitHub Actions secret.'
              );
            }

            const credentials = JSON.parse(rawCredentials);
            if (credentials.project_id !== process.env.FIREBASE_PROJECT_ID) {
              throw new Error('The service account project_id does not match myfinc-4b36e.');
            }

            initializeApp({
              credential: cert(credentials),
              projectId: process.env.FIREBASE_PROJECT_ID,
            });

            if (isManual) {
              if (process.env.SEND_TEST === 'true') {
                const title = 'MyFinc · Prueba de notificaciones';
                const body = 'Firebase Cloud Messaging está conectado correctamente.';
                const messageId = await getMessaging().send({
                  topic: 'myfinc_announcements',
                  notification: { title, body },
                  data: {
                    id: `fcm-test-${Date.now()}`,
                    title,
                    body,
                    level: 'info',
                    source: 'fcm_test',
                  },
                  android: {
                    priority: 'high',
                    notification: { channelId: 'myfinc_general_v2' },
                  },
                });
                console.log(`Test notification sent to myfinc_announcements; FCM message id: ${messageId}`);
                return;
              }

              if (process.env.SEND_UPDATE === 'true') {
                const version = String(process.env.RELEASE_VERSION || '').trim();
                if (!/^v?\d+\.\d+\.\d+$/.test(version)) {
                  throw new Error('Enter a valid version, for example 0.1.5.');
                }
                const normalizedVersion = version.startsWith('v') ? version : `v${version}`;
                const title = String(process.env.NOTIFICATION_TITLE || `Nueva actualización de MyFinc ${normalizedVersion}`).trim().slice(0, 200);
                const body = String(process.env.NOTIFICATION_BODY || `Ya está disponible MyFinc ${normalizedVersion}. Abre la aplicación para consultar los cambios y comprobar la actualización.`).trim().slice(0, 4000);
                if (!title || !body) throw new Error('Notification title and message cannot be empty.');

                const messageId = await getMessaging().send({
                  topic: 'myfinc_announcements',
                  notification: { title, body },
                  data: {
                    id: `release:${normalizedVersion}`,
                    title,
                    body,
                    level: 'info',
                    source: 'release',
                    tag: normalizedVersion,
                    url: `https://github.com/K3NYEL/myfinc/releases/tag/${normalizedVersion}`,
                  },
                  android: {
                    priority: 'high',
                    notification: { channelId: 'myfinc_general_v2' },
                  },
                });
                console.log(`Release notification sent for ${normalizedVersion}; FCM message id: ${messageId}`);
                return;
              }

              console.log('Firebase credentials are valid. Select send_test or send_update to send a message; no notification was sent.');
              return;
            }

            const current = JSON.parse(
              fs.readFileSync('docs/updates/manifest.json', 'utf8')
            );
            const currentNotices = Array.isArray(current.notifications)
              ? current.notifications
              : [];

            let previousIds = new Set();
            const before = process.env.BEFORE_SHA;
            const isPush = process.env.EVENT_NAME === 'push';
            if (isPush && before && !/^0+$/.test(before)) {
              try {
                const previousText = execFileSync(
                  'git',
                  ['show', `${before}:docs/updates/manifest.json`],
                  { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }
                );
                const previous = JSON.parse(previousText);
                previousIds = new Set(
                  (Array.isArray(previous.notifications) ? previous.notifications : [])
                    .map((item) => item.id)
                    .filter((id) => typeof id === 'string')
                );
              } catch {
                console.log('Previous manifest unavailable; no historical notices will be resent.');
                // Fail closed rather than broadcast every old notice.
                return;
              }
            }

            const newNotices = currentNotices.filter((notice) =>
              notice &&
              typeof notice.id === 'string' &&
              !previousIds.has(notice.id)
            );

            if (newNotices.length === 0) {
              console.log('No newly added notices; nothing to send.');
              return;
            }

            for (const notice of newNotices) {
              const title = String(notice.title || 'MyFinc').trim().slice(0, 200);
              const body = String(notice.message || '').trim().slice(0, 4000);
              if (!title || !body) {
                console.log(`Skipping notice ${notice.id}: title or message is empty.`);
                continue;
              }

              const messageId = await getMessaging().send({
                topic: 'myfinc_announcements',
                notification: { title, body },
                data: {
                  id: String(notice.id),
                  title,
                  body,
                  level: String(notice.level || 'info'),
                  source: 'notice',
                },
                android: {
                  priority: 'high',
                  notification: { channelId: 'myfinc_general_v2' },
                },
              });
              console.log(`Sent notice ${notice.id}; FCM message id: ${messageId}`);
            }
          }

          main().catch((error) => {
            console.error(error.message || error);
            process.exitCode = 1;
          });
          NODE
